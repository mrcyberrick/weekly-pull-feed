name: Post to Facebook

# comic-preorder docs/facebook-weekly-post.md - one Facebook Page photo post per week,
# linking to the shop's own news page (rjbookstop.com/news/), with a picture of three
# "spotlight" covers (most copies received that week, shown in title order, never ranked).
#
#   tests -> check the news page shows THIS week -> already posted? -> build the picture
#   (headless Chrome) -> post -> read the post back. A red run is GitHub's email to Rick.
#
# Separate from the newsletter on purpose:
#   - `permissions: contents: read`: it never commits, so it can never start a Pages
#     build or race the newsletter's (F98 / F100)
#   - no Brevo variable or secret: it cannot touch the email
#   - its own concurrency group: it never waits behind, or cancels, a newsletter run
#   - its tests live in test/facebook/, outside the newsletter build's test/*.test.mjs
#
# WHEN IT RUNS (2026-10-28, Rick: "option 1"): straight after the newsletter's
# SCHEDULED run succeeds, Tuesday evening, the night before in-store day. That is the
# moment the news page switches to the new week, so the link is always right. No clock
# or time zone of its own: the newsletter's cron is the only clock. It used to be its
# own cron (Wednesday 12:00 UTC); GitHub never started that run on 2026-10-28.
#   - a newsletter run that fails, or a MANUAL newsletter run, does not start it; after
#     a manual recovery send, run this workflow by hand (dry_run off)
#   - the news page can lag the newsletter by its cache (Worker 5 min, Pages 10), so
#     the script re-checks once a minute for up to FEED_WAIT_MINUTES before failing
#
# NOTHING IS POSTED AUTOMATICALLY until the repository variable FACEBOOK_ENABLED is
# "true". A manual run (workflow_dispatch) always works and is a DRY RUN by default: it
# builds the picture and attaches it to the run, and posts nothing.
#
# Secret:    FACEBOOK_PAGE_TOKEN (a Page access token; never printed, never in a URL)
# Variables: FACEBOOK_ENABLED, FACEBOOK_PAGE_ID, FACEBOOK_GRAPH_VERSION, LANDING_URL,
#            FEED_CHECK_URL, STORE_NAME, STORE_TOWN, STORE_APP_URL, SUPABASE_URL,
#            SUPABASE_ANON_KEY (the last two already exist for the newsletter)

on:
  workflow_run:
    workflows: ["Send Weekly Newsletter"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the picture and the message, post nothing (default, safest)"
        type: boolean
        default: true
      week:
        description: "Any date inside the week to post (YYYY-MM-DD). Blank = this week. Only this week or last week can be built (the spotlight lookup refuses others)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: facebook
  cancel-in-progress: false

jobs:
  post:
    # Automatic only after a SCHEDULED newsletter run that succeeded: a manual one may
    # be build-only or a dry run, and a failed one means the news page is not updated.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (vars.FACEBOOK_ENABLED == 'true'
              && github.event.workflow_run.event == 'schedule'
              && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: node --test "test/facebook/*.test.mjs"

      # The picture is a headless-Chrome screenshot. GitHub's Ubuntu image ships Google
      # Chrome; fail clearly here if that ever stops being true.
      - name: Check Chrome is available
        run: google-chrome --version

      # Dedupe. Facebook refuses this app a read of the Page's posts (code 100,
      # subcode 33, measured 2026-10-21), so the record of "posted for week X on
      # Page Y" is a GitHub Actions cache entry. The week comes from the builder's
      # own rule, the same one the script uses.
      - name: Work out the week
        id: week
        env:
          WEEK: ${{ inputs.week }}
        run: |
          node -e "
            const b = require('./scripts/build-pull-feed.js');
            const { refDate } = b.resolveTargetWeek({ weekArg: process.env.WEEK || null, today: b.todayUTC() });
            console.log('start=' + b.weekRange(refDate).start);
          " >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Already posted this week?
        id: posted
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/fb-out/posted-${{ steps.week.outputs.start }}.txt
          key: fb-posted-${{ vars.FACEBOOK_PAGE_ID }}-${{ steps.week.outputs.start }}
          lookup-only: true

      - name: Build the picture and post
        env:
          ALREADY_POSTED: ${{ steps.posted.outputs.cache-hit }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TENANT_SLUG: rjbookstop
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          LANDING_URL: ${{ vars.LANDING_URL }}
          FEED_CHECK_URL: ${{ vars.FEED_CHECK_URL }}
          STORE_NAME: ${{ vars.STORE_NAME }}
          STORE_TOWN: ${{ vars.STORE_TOWN }}
          STORE_APP_URL: ${{ vars.STORE_APP_URL }}
          CHROME_BIN: google-chrome
          OUT_DIR: ${{ github.workspace }}/fb-out
          WEEK: ${{ inputs.week }}
          FEED_WAIT_MINUTES: ${{ github.event_name == 'workflow_run' && '20' || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/post-facebook.js

      # The script writes the record the moment Facebook returns a post id, before
      # it reads the post back, so this saves it even if the read-back fails and the
      # run is red. No file (dry run, or nothing posted) = nothing saved.
      - name: Record that this week is posted
        if: ${{ always() && hashFiles('fb-out/posted-*.txt') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/fb-out/posted-${{ steps.week.outputs.start }}.txt
          key: fb-posted-${{ vars.FACEBOOK_PAGE_ID }}-${{ steps.week.outputs.start }}

      - name: Attach the picture to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-picture
          path: ${{ github.workspace }}/fb-out/fb-*.png
          # A run that got as far as building the picture must attach it; an early
          # failure (no rows, stale page) has none, which is fine, so warn, not fail.
          if-no-files-found: warn
          retention-days: 30
